<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cracovie</title>

  <!-- Icône et mode Web App pour écran d'accueil iPhone (Safari) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icone.jpg" />
  <link rel="icon" type="image/jpeg" href="icone.jpg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cracovie" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --text: #1F2421;
      --muted: #646E68;
      --border: #E6E0D6;
      --day1: #8B2635; /* Bordeaux */
      --day2: #2D6A4F; /* Vert sauge foncé */
      --day3: #C87D32; /* Ocre chaud */
      --hub: #1E293B;  /* Ardoise foncé pour Hôtel / Gare / Aéroport */
      --gps: #2563EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Day Filters */
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .filter-btn.active {
      background: var(--text);
      color: #FFF;
      border-color: var(--text);
    }
    .filter-btn[data-day="1"].active { background: var(--day1); border-color: var(--day1); }
    .filter-btn[data-day="2"].active { background: var(--day2); border-color: var(--day2); }
    .filter-btn[data-day="3"].active { background: var(--day3); border-color: var(--day3); }

    /* Fullscreen Map Container */
    .main-container {
      flex: 1;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Bottom Controls */
    .list-toggle-btn {
      position: absolute;
      left: 16px;
      bottom: 22px;
      z-index: 900;
      height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .list-toggle-btn:active { transform: scale(0.95); }

    .gps-btn {
      position: absolute;
      right: 16px;
      bottom: 22px;
      z-index: 900;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.15s ease, background 0.2s;
    }

    .gps-btn:active { transform: scale(0.94); }
    .gps-btn.tracking {
      background: var(--gps);
      color: #FFF;
      border-color: var(--gps);
    }

    /* Custom Map Markers & Labels */
    .custom-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #FFF;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 8px rgba(0,0,0,0.32);
    }

    .hub-marker {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--hub);
      color: #FFF;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .place-label-tooltip {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      padding: 2px 7px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #1F2421;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }
    .place-label-tooltip::before {
      display: none;
    }

    /* GPS Pulse Marker */
    .gps-dot {
      width: 16px;
      height: 16px;
      background: var(--gps);
      border: 3px solid #FFF;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25);
    }

    /* Slide-over List Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 1500;
      display: none;
      justify-content: flex-start;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .list-drawer {
      width: 88%;
      max-width: 390px;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,0.2);
      animation: slideRight 0.22s ease-out;
    }

    @keyframes slideRight {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }

    .drawer-header {
      background: var(--surface);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 28px;
    }

    .day-section-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-section-title:first-child { margin-top: 2px; }

    .place-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .place-item:hover {
      border-color: var(--text);
    }

    .step-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #FFF;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-badge.hub {
      border-radius: 8px;
      background: var(--hub);
      font-size: 0.85rem;
    }

    .place-info {
      flex: 1;
      min-width: 0;
    }

    .place-time {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .place-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .place-cat {
      font-size: 0.74rem;
      color: var(--muted);
    }

    /* Detail Card Modal */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .detail-overlay.open {
      display: flex;
    }

    @media (min-width: 820px) {
      .detail-overlay {
        align-items: center;
      }
    }

    .detail-card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .detail-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #FFF;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .detail-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .close-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      flex-shrink: 0;
    }

    .detail-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .detail-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 12px;
    }

    .detail-box {
      background: var(--bg);
      border-left: 3px solid var(--text);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .detail-box.transit {
      border-left-color: #2563EB;
      background: #F4F7FC;
      margin-bottom: 16px;
    }

    .detail-box-label {
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .gmaps-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: var(--text);
      color: #FFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
      transition: opacity 0.2s;
    }

    .gmaps-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>Cracovie • 20 au 22 Nov.</h1>
      <div class="subtitle">Arrivée Ven. 12h • Départ Dim. ~15h30</div>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-day="all">Tout le séjour</button>
    <button class="filter-btn" data-day="1"><span class="dot" style="background:var(--day1)"></span>Ven. 20</button>
    <button class="filter-btn" data-day="2"><span class="dot" style="background:var(--day2)"></span>Sam. 21</button>
    <button class="filter-btn" data-day="3"><span class="dot" style="background:var(--day3)"></span>Dim. 22</button>
  </div>
</header>

<div class="main-container">
  <div id="map"></div>

  <!-- Bottom-left List Button -->
  <button class="list-toggle-btn" id="openListBtn" aria-label="Voir les activités en liste">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"></line>
      <line x1="8" y1="12" x2="21" y2="12"></line>
      <line x1="8" y1="18" x2="21" y2="18"></line>
      <line x1="3" y1="6" x2="3.01" y2="6"></line>
      <line x1="3" y1="12" x2="3.01" y2="12"></line>
      <line x1="3" y1="18" x2="3.01" y2="18"></line>
    </svg>
    Activités
  </button>

  <!-- Bottom-right GPS Button -->
  <button class="gps-btn" id="gpsBtn" title="Ma position en temps réel" aria-label="Ma position en temps réel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
    </svg>
  </button>
</div>

<!-- Slide-over List Drawer -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="list-drawer">
    <div class="drawer-header">
      <h2>Programme & Repères</h2>
      <button class="close-btn" id="closeListBtn" aria-label="Fermer la liste">&times;</button>
    </div>
    <div class="drawer-content" id="listPanel"></div>
  </div>
</div>

<!-- Detail Card Modal -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <div>
        <span class="detail-badge" id="detailDayBadge">Jour 1</span>
        <h2 class="detail-title" id="detailTitle">Titre du lieu</h2>
      </div>
      <button class="close-btn" id="closeDetail" aria-label="Fermer">&times;</button>
    </div>
    <div class="detail-meta" id="detailMeta">Horaire • Quartier</div>
    <p class="detail-desc" id="detailDesc">Description</p>
    <div class="detail-box" id="detailTip"></div>
    <div class="detail-box transit" id="detailTransit"></div>
    <a href="#" target="_blank" rel="noopener noreferrer" class="gmaps-btn" id="detailGmaps">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      Ouvrir dans Google Maps
    </a>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
