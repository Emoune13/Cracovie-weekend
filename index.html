<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Week-end à Cracovie • 20–22 Nov</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --text: #1F2421;
      --muted: #646E68;
      --border: #E6E0D6;
      --day1: #8B2635; /* Bordeaux */
      --day2: #2D6A4F; /* Vert sauge foncé */
      --day3: #C87D32; /* Ocre chaud */
      --hub: #1E293B;  /* Ardoise foncé pour Hôtel / Gare / Aéroport */
      --gps: #2563EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Day Filters */
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .filter-btn.active {
      background: var(--text);
      color: #FFF;
      border-color: var(--text);
    }
    .filter-btn[data-day="1"].active { background: var(--day1); border-color: var(--day1); }
    .filter-btn[data-day="2"].active { background: var(--day2); border-color: var(--day2); }
    .filter-btn[data-day="3"].active { background: var(--day3); border-color: var(--day3); }

    /* Fullscreen Map Container */
    .main-container {
      flex: 1;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Bottom Controls */
    .list-toggle-btn {
      position: absolute;
      left: 16px;
      bottom: 22px;
      z-index: 900;
      height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .list-toggle-btn:active { transform: scale(0.95); }

    .gps-btn {
      position: absolute;
      right: 16px;
      bottom: 22px;
      z-index: 900;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.15s ease, background 0.2s;
    }

    .gps-btn:active { transform: scale(0.94); }
    .gps-btn.tracking {
      background: var(--gps);
      color: #FFF;
      border-color: var(--gps);
    }

    /* Custom Map Markers & Labels */
    .custom-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #FFF;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 8px rgba(0,0,0,0.32);
    }

    .hub-marker {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--hub);
      color: #FFF;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .place-label-tooltip {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      padding: 2px 7px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #1F2421;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }
    .place-label-tooltip::before {
      display: none;
    }

    /* GPS Pulse Marker */
    .gps-dot {
      width: 16px;
      height: 16px;
      background: var(--gps);
      border: 3px solid #FFF;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25);
    }

    /* Slide-over List Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 1500;
      display: none;
      justify-content: flex-start;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .list-drawer {
      width: 88%;
      max-width: 390px;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,0.2);
      animation: slideRight 0.22s ease-out;
    }

    @keyframes slideRight {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }

    .drawer-header {
      background: var(--surface);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 28px;
    }

    .day-section-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-section-title:first-child { margin-top: 2px; }

    .place-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .place-item:hover {
      border-color: var(--text);
    }

    .step-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #FFF;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-badge.hub {
      border-radius: 8px;
      background: var(--hub);
      font-size: 0.85rem;
    }

    .place-info {
      flex: 1;
      min-width: 0;
    }

    .place-time {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .place-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .place-cat {
      font-size: 0.74rem;
      color: var(--muted);
    }

    /* Detail Card Modal */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .detail-overlay.open {
      display: flex;
    }

    @media (min-width: 820px) {
      .detail-overlay {
        align-items: center;
      }
    }

    .detail-card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .detail-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #FFF;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .detail-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .close-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      flex-shrink: 0;
    }

    .detail-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .detail-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 14px;
    }

    .detail-tip {
      background: var(--bg);
      border-left: 3px solid var(--text);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .gmaps-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: var(--text);
      color: #FFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
      transition: opacity 0.2s;
    }

    .gmaps-btn:hover { opacity: 0.9; }
  </style>
</head>

<header>
  <div class="header-top">

    <button class="filter-btn" data-day="2"><span class="dot" style="background:var(--day2)"></span>Sam. 21</button>
    <button class="filter-btn" data-day="3"><span class="dot" style="background:var(--day3)"></span>Dim. 22</button>
  </div>
</header>

<div class="main-container">

  </button>

</div>

<!-- Slide-over List Drawer -->
<div class="drawer-overlay" id="drawerOverlay">

</div>

<!-- Detail Card Modal -->
<div class="detail-overlay" id="detailOverlay">

    <div class="detail-tip" id="detailTip">Conseil</div>

  </div>
</div>

      desc: 'Traversez la Vistule par la passerelle piétonne ornée de sculptures d’acrobates suspendues pour rejoindre Kazimierz, l’ancien quartier juif devenu le cœur bohème et artistique de la ville.',
      tip: 'Passez par la rue Józefa et le passage Meiselsa (lieu de tournage de La Liste de Schindler).',
      gmaps: 'https://www.google.com/maps/search/?api=1&query=Kladka+Ojca+Bernatka+Krakow'
    },
    {

      day: 2,

      time: '14h30',
      shortName: 'Plac Nowy (Zapiekanka)',
      title: 'Plac Nowy & Zapiekanka',
      category: 'Street-food culte • Kazimierz',
      lat: 50.0518,
      lng: 19.9445,
      desc: 'Le cœur battant de Kazimierz. Au centre de la place, les guichets de la rotonde servent la fameuse Zapiekanka : une demi-baguette croustillante gratinée aux champignons et fromage.',

    },
    {
      id: 's5',
      day: 2,
      step: 5,
      time: '21h00',
      shortName: 'Alchemia (Kazimierz)',
      title: 'Alchemia & Bars de Kazimierz',
      category: 'Soirée • Kazimierz',
      lat: 50.0515,
      lng: 19.9441,
      desc: 'Institution nocturne juste à côté de Plac Nowy : éclairage aux bougies, mobilier chiné et atmosphère décalée très prisée des étudiants.',
      tip: 'Explorez aussi les bars cachés dans les cours intérieures de la rue Estery et de la rue Szeroka.',

    },

    // DIMANCHE 22 NOVEMBRE (Départ ~15h30 - 16h)
    {
      id: 'd1',
      day: 3,
      step: 1,
      time: '10h15',
      shortName: 'Rynek Underground',
      title: 'Rynek Underground (Souterrains)',
      category: 'Musée immersif • Rynek Główny',
      lat: 50.0619,
      lng: 19.9379,
      desc: 'Situé 4 mètres sous les pavés de la place du marché, ce musée archéologique moderne permet de marcher sur les véritables rues médiévales avec hologrammes et reconstitutions.',
      tip: 'Demandez le tarif étudiant (bilet ulgowy ~28 PLN / 6,50 €) avec votre carte physique. Visite d’environ 1h15.',
      gmaps: 'https://www.google.com/maps/search/?api=1&query=Rynek+Underground+Krakow'
    },
    {
      id: 'd2',
      day: 3,
      step: 2,
      time: '12h00',
      shortName: 'Musée Czartoryski',
      title: 'Musée Czartoryski (La Dame à l’hermine)',
      category: 'Chef-d’œuvre • Vieille Ville',
      lat: 50.0646,
      lng: 19.9399,
      desc: 'Musée à taille humaine abritant le célèbre tableau de Léonard de Vinci, La Dame à l’hermine, ainsi que des œuvres de Rembrandt.',
      tip: 'Tarif étudiant réduit très avantageux. Comptez 1h à 1h15 de visite.',
      gmaps: 'https://www.google.com/maps/search/?api=1&query=Muzeum+Ksiazat+Czartoryskich+Krakow'
    },
    {
      id: 'd3',
      day: 3,
      step: 3,
      time: '13h30',
      shortName: 'Parc Planty & Porte St-Florian',
      title: 'Parc Planty & Porte Saint-Florian',
      category: 'Dernière balade & Déjeuner • Centre',
      lat: 50.0649,
      lng: 19.9415,
      desc: 'Terminez par une marche le long de la ceinture verte des Planty jusqu’à la Barbacane, juste à côté de la gare centrale (Kraków Główny) pour récupérer vos sacs et rejoindre l’aéroport vers 15h30.',
      tip: 'Le train direct pour l’aéroport (SKA1) part de Kraków Główny toutes les 30 min et met 17 minutes.',
      gmaps: 'https://www.google.com/maps/search/?api=1&query=Brama+Florianska+Krakow'
    }
  ];

  // Init Map with high-DPI / Retina support
  const map = L.map('map', { zoomControl: false }).setView([50.058, 19.942], 14);
  L.control.zoom({ position: 'topright' }).addTo(map);

  // Crisp HD Esri World Street Map (net sur écrans Retina / mobile, sans clé API)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; OpenStreetMap contributors',
    maxZoom: 19,
    detectRetina: true
  }).addTo(map);

  const hubsLayer = L.layerGroup().addTo(map);
  const markersLayer = L.layerGroup().addTo(map);
  const routesLayer = L.layerGroup().addTo(map);
  const routeCache = {}; // Cache des tracés OSRM
  let currentDay = 'all';

  // Render permanent Hubs (Hotel, Train Station, Airport)
  function renderHubs() {
    hubsLayer.clearLayers();
    HUBS.forEach(hub => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="hub-marker">${hub.icon}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const marker = L.marker([hub.lat, hub.lng], { icon, zIndexOffset: 500 }).addTo(hubsLayer);
      marker.bindTooltip(hub.shortName, {
        permanent: true,
        direction: 'right',
        offset: [14, 0],
        className: 'place-label-tooltip'
      });

      marker.on('click', () => openDetail(hub, true));
    });
  }

  // Fetch real pedestrian street route via OSRM
  async function drawRealStreetRoute(dayNumber) {
    const dayPlaces = PLACES.filter(p => p.day === dayNumber);
    if (dayPlaces.length < 2) return;

    // Include Flamingo Hostel at the start of each day's walking route for realistic context
    const hotel = HUBS[0];
    const waypoints = [hotel, ...dayPlaces];
    const coordsString = waypoints.map(p => `${p.lng},${p.lat}`).join(';');

    // Use cached geometry if already fetched
    if (routeCache[dayNumber]) {
      L.polyline(routeCache[dayNumber], {
        color: DAY_COLORS[dayNumber],
        weight: 4.5,
        opacity: 0.85,
        lineJoin: 'round'
      }).addTo(routesLayer);
      return;
    }

    try {
      const url = `https://router.project-osrm.org/route/v1/foot/${coordsString}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
        const latlngs = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        routeCache[dayNumber] = latlngs;

        // Only draw if user hasn't switched filter in the meantime
        if (currentDay === 'all' || Number(currentDay) === dayNumber) {
          L.polyline(latlngs, {
            color: DAY_COLORS[dayNumber],
            weight: 4.5,
            opacity: 0.85,
            lineJoin: 'round'
          }).addTo(routesLayer);
        }
        return;
      }
    } catch (e) {
      // Fallback straight line if offline
    }

    const fallbackCoords = waypoints.map(p => [p.lat, p.lng]);
    L.polyline(fallbackCoords, {
      color: DAY_COLORS[dayNumber],
      weight: 3.5,
      opacity: 0.75,
      dashArray: '6, 8'
    }).addTo(routesLayer);
  }

  // Render Map Markers & List Drawer
  function render(dayFilter) {
    markersLayer.clearLayers();
    routesLayer.clearLayers();
    const listPanel = document.getElementById('listPanel');
    listPanel.innerHTML = '';

    // 1. Add Hubs section at top of Drawer List
    const hubHeader = document.createElement('div');
    hubHeader.className = 'day-section-title';
    hubHeader.innerHTML = `<span class="dot" style="background:var(--hub)"></span>Repères & Transports`;
    listPanel.appendChild(hubHeader);

    HUBS.forEach(hub => {
      const item = document.createElement('div');
      item.className = 'place-item';
      item.innerHTML = `
        <div class="step-badge hub">${hub.icon}</div>
        <div class="place-info">
          <div class="place-title">${hub.title}</div>
          <div class="place-cat">${hub.category}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      `;
      item.addEventListener('click', () => {
        closeDrawer();
        map.flyTo([hub.lat, hub.lng], hub.id === 'hub-airport' ? 14 : 16, { duration: 0.6 });
        openDetail(hub, true);
      });
      listPanel.appendChild(item);
    });

    // 2. Filter itinerary places
    const filtered = dayFilter === 'all'
      ? PLACES
      : PLACES.filter(p => p.day === Number(dayFilter));

    // Draw real street routes per day
    const daysToDraw = dayFilter === 'all' ? [1, 2, 3] : [Number(dayFilter)];
    daysToDraw.forEach(d => drawRealStreetRoute(d));

    // Add markers with permanent name labels & list items
    let lastDay = null;
    const bounds = HUBS.filter(h => h.inDefaultBounds).map(h => [h.lat, h.lng]);

    filtered.forEach(place => {
      bounds.push([place.lat, place.lng]);

      if (place.day !== lastDay) {
        const titleEl = document.createElement('div');
        titleEl.className = 'day-section-title';
        titleEl.innerHTML = `<span class="dot" style="background:${DAY_COLORS[place.day]}"></span>${DAY_NAMES[place.day]}`;
        listPanel.appendChild(titleEl);
        lastDay = place.day;
      }

      const icon = L.divIcon({
        className: '',
        html: `<div class="custom-marker" style="background:${DAY_COLORS[place.day]}">${place.step}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      const marker = L.marker([place.lat, place.lng], { icon }).addTo(markersLayer);
      marker.bindTooltip(place.shortName, {
        permanent: true,
        direction: 'right',
        offset: [13, 0],
        className: 'place-label-tooltip'
      });

      marker.on('click', () => openDetail(place, false));

      // Drawer list item
      const item = document.createElement('div');
      item.className = 'place-item';
      item.innerHTML = `
        <div class="step-badge" style="background:${DAY_COLORS[place.day]}">${place.step}</div>
        <div class="place-info">
          <div class="place-time">${place.time}</div>
          <div class="place-title">${place.title}</div>
          <div class="place-cat">${place.category}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      `;
      item.addEventListener('click', () => {
        closeDrawer();
        map.flyTo([place.lat, place.lng], 16, { duration: 0.6 });
        openDetail(place, false);
      });
      listPanel.appendChild(item);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [45, 45] });
    }
  }

  // Drawer open/close logic
  const drawerOverlay = document.getElementById('drawerOverlay');
  document.getElementById('openListBtn').addEventListener('click', () => {
    drawerOverlay.classList.add('open');
  });
  function closeDrawer() {
    drawerOverlay.classList.remove('open');
  }
  document.getElementById('closeListBtn').addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', (e) => {
    if (e.target === drawerOverlay) closeDrawer();
  });

  // Detail Modal logic
  const overlay = document.getElementById('detailOverlay');
  const closeBtn = document.getElementById('closeDetail');

  function openDetail(item, isHub) {
    const badge = document.getElementById('detailDayBadge');
    if (isHub) {
      badge.textContent = `${item.icon} Repère fixe`;
      badge.style.background = '#1E293B';
      document.getElementById('detailMeta').textContent = item.category;
    } else {
      badge.textContent = `Jour ${item.day} • Étape ${item.step}`;
      badge.style.background = DAY_COLORS[item.day];
      document.getElementById('detailMeta').textContent = `${item.time} — ${item.category}`;
    }

    document.getElementById('detailTitle').textContent = item.title;
    document.getElementById('detailDesc').textContent = item.desc;
    document.getElementById('detailTip').textContent = `💡 ${item.tip}`;
    document.getElementById('detailGmaps').href = item.gmaps;

    overlay.classList.add('open');
  }

  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDay = btn.dataset.day;
      render(currentDay);
    });
  });

  // Real-time GPS tracking
  const gpsBtn = document.getElementById('gpsBtn');
  let watchId = null;
  let userMarker = null;
  let userCircle = null;

  gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert("La géolocalisation n'est pas supportée par votre navigateur.");
      return;
    }

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      gpsBtn.classList.remove('tracking');
      if (userMarker) map.removeLayer(userMarker);
      if (userCircle) map.removeLayer(userCircle);
      userMarker = null;
      userCircle = null;
      return;
    }

    gpsBtn.classList.add('tracking');
    let firstFix = true;

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const latlng = [latitude, longitude];

        if (!userMarker) {
          const gpsIcon = L.divIcon({
            className: '',
            html: '<div class="gps-dot"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });
          userMarker = L.marker(latlng, { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          userCircle = L.circle(latlng, {
            radius: accuracy,
            color: '#2563EB',
            fillColor: '#2563EB',
            fillOpacity: 0.12,
            weight: 1
          }).addTo(map);
        } else {
          userMarker.setLatLng(latlng);
          userCircle.setLatLng(latlng).setRadius(accuracy);
        }

        if (firstFix) {
          map.flyTo(latlng, 16);
          firstFix = false;
        }
      },
      (err) => {
        alert("Impossible d'accéder à votre position GPS. Vérifiez les autorisations de Safari/Chrome.");
        gpsBtn.classList.remove('tracking');
        watchId = null;
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  });

  // Initial render
  renderHubs();
  render('all');
</script>
