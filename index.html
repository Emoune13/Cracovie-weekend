<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cracovie</title>

  <!-- Icône et mode Web App pour écran d'accueil iPhone (Safari) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icone.jpg" />
  <link rel="icon" type="image/jpeg" href="icone.jpg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cracovie" />
  
  <!-- Leaflet CSS (sans restriction SRI pour éviter tout blocage) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --text: #1F2421;
      --muted: #646E68;
      --border: #E6E0D6;
      --day1: #8B2635;
      --day2: #2D6A4F;
      --day3: #C87D32;
      --hub: #1E293B;
      --gps: #2563EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .filter-btn.active {
      background: var(--text);
      color: #FFF;
      border-color: var(--text);
    }
    .filter-btn[data-day="1"].active { background: var(--day1); border-color: var(--day1); }
    .filter-btn[data-day="2"].active { background: var(--day2); border-color: var(--day2); }
    .filter-btn[data-day="3"].active { background: var(--day3); border-color: var(--day3); }

    .main-container {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 300px;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .list-toggle-btn {
      position: absolute;
      left: 16px;
      bottom: 22px;
      z-index: 900;
      height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .gps-btn {
      position: absolute;
      right: 16px;
      bottom: 22px;
      z-index: 900;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
    }

    .gps-btn.tracking {
      background: var(--gps);
      color: #FFF;
      border-color: var(--gps);
    }

    .custom-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #FFF;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 8px rgba(0,0,0,0.32);
    }

    .hub-marker {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--hub);
      color: #FFF;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .place-label-tooltip {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      padding: 2px 7px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #1F2421;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }
    .place-label-tooltip::before {
      display: none;
    }

    .gps-dot {
      width: 16px;
      height: 16px;
      background: var(--gps);
      border: 3px solid #FFF;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25);
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 1500;
      display: none;
      justify-content: flex-start;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .list-drawer {
      width: 88%;
      max-width: 390px;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,0.2);
    }

    .drawer-header {
      background: var(--surface);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 28px;
    }

    .day-section-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-section-title:first-child { margin-top: 2px; }

    .place-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }

    .step-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #FFF;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-badge.hub {
      border-radius: 8px;
      background: var(--hub);
      font-size: 0.85rem;
    }

    .place-info {
      flex: 1;
      min-width: 0;
    }

    .place-time {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .place-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .place-cat {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .detail-overlay.open {
      display: flex;
    }

    @media (min-width: 820px) {
      .detail-overlay {
        align-items: center;
      }
    }

    .detail-card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .detail-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #FFF;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .detail-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .close-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      flex-shrink: 0;
    }

    .detail-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .detail-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 12px;
    }

    .detail-box {
      background: var(--bg);
      border-left: 3px solid var(--text);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .detail-box.transit {
      border-left-color: #2563EB;
      background: #F4F7FC;
      margin-bottom: 16px;
    }

    .detail-box-label {
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .gmaps-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: var(--text);
      color: #FFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>Cracovie • 20 au 22 Nov.</h1>
      <div class="subtitle">Arrivée Ven. 12h • Départ Dim. ~15h30</div>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-day="all">Tout le séjour</button>
    <button class="filter-btn" data-day="1"><span class="dot" style="background:var(--day1)"></span>Ven. 20</button>
    <button class="filter-btn" data-day="2"><span class="dot" style="background:var(--day2)"></span>Sam. 21</button>
    <button class="filter-btn" data-day="3"><span class="dot" style="background:var(--day3)"></span>Dim. 22</button>
  </div>
</header>

<div class="main-container">
  <div id="map"></div>

  <button class="list-toggle-btn" id="openListBtn" aria-label="Voir les activités en liste">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"></line>
      <line x1="8" y1="12" x2="21" y2="12"></line>
      <line x1="8" y1="18" x2="21" y2="18"></line>
      <line x1="3" y1="6" x2="3.01" y2="6"></line>
      <line x1="3" y1="12" x2="3.01" y2="12"></line>
      <line x1="3" y1="18" x2="3.01" y2="18"></line>
    </svg>
    Activités
  </button>

  <button class="gps-btn" id="gpsBtn" title="Ma position en temps réel" aria-label="Ma position en temps réel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
    </svg>
  </button>
</div>

<div class="drawer-overlay" id="drawerOverlay">
  <div class="list-drawer">
    <div class="drawer-header">
      <h2>Programme & Repères</h2>
      <button class="close-btn" id="closeListBtn" aria-label="Fermer la liste">&times;</button>
    </div>
    <div class="drawer-content" id="listPanel"></div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <div>
        <span class="detail-badge" id="detailDayBadge">Jour 1</span>
        <h2 class="detail-title" id="detailTitle">Titre du lieu</h2>
      </div>
      <button class="close-btn" id="closeDetail" aria-label="Fermer">&times;</button>
    </div>
    <div class="detail-meta" id="detailMeta">Horaire • Quartier</div>
    <p class="detail-desc" id="detailDesc">Description</p>
    <div class="detail-box" id="detailTip"></div>
    <div class="detail-box transit" id="detailTransit"></div>
    <a href="#" target="_blank" rel="noopener noreferrer" class="gmaps-btn" id="detailGmaps">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      Ouvrir dans Google Maps
    </a>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    {

      gmaps: 'https://www.google.com/maps/search/?api=1&query=Muzeum+Ksiazat+Czartoryskich+Krakow'
    },
    {
      id: 'd3',
      day: 3,
      step: 3,
      time: '13h30',
      shortName: 'Parc Planty & Porte St-Florian',
      title: 'Parc Planty & Porte Saint-Florian',
      category: 'Dernière balade & Déjeuner • Centre',
      lat: 50.0649,
      lng: 19.9415,
      desc: 'Terminez par un passage devant la Barbacane et les remparts médiévaux, juste à côté de la gare centrale (Kraków Główny) pour rejoindre l’aéroport vers 15h30.',
      tip: 'Le train direct pour l’aéroport (SKA1) part de Kraków Główny toutes les 30 min et met 17 minutes.',
      transit: 'À 1 min du musée (100 m), puis 6 min à pied jusqu’à la gare Kraków Główny (ou 5 min pour récupérer vos bagages au Flamingo Hostel avant de prendre un Bolt/tram).',

  ];

  const map = L.map('map', { zoomControl: false }).setView([50.058, 19.942], 14);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; OpenStreetMap contributors',
    maxZoom: 19,
    detectRetina: true
  }).addTo(map);

  const hubsLayer = L.layerGroup().addTo(map);
  const markersLayer = L.layerGroup().addTo(map);
  let currentDay = 'all';

  function renderHubs() {
    hubsLayer.clearLayers();
    HUBS.forEach(hub => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="hub-marker">${hub.icon}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const marker = L.marker([hub.lat, hub.lng], { icon, zIndexOffset: 500 }).addTo(hubsLayer);
      marker.bindTooltip(hub.shortName, {
        permanent: true,
        direction: 'right',
        offset: [14, 0],
        className: 'place-label-tooltip'
      });

      marker.on('click', () => openDetail(hub, true));
    });
  }

  function render(dayFilter) {
    markersLayer.clearLayers();
    const listPanel = document.getElementById('listPanel');
    listPanel.innerHTML = '';

    const hubHeader = document.createElement('div');
    hubHeader.className = 'day-section-title';
    hubHeader.innerHTML = `<span class="dot" style="background:var(--hub)"></span>Repères & Transports`;
    listPanel.appendChild(hubHeader);

    HUBS.forEach(hub => {
      const item = document.createElement('div');
      item.className = 'place-item';
      item.innerHTML = `
        <div class="step-badge hub">${hub.icon}</div>
        <div class="place-info">
          <div class="place-title">${hub.title}</div>
          <div class="place-cat">${hub.category}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      `;
      item.addEventListener('click', () => {
        closeDrawer();
        map.flyTo([hub.lat, hub.lng], hub.id === 'hub-airport' ? 14 : 16, { duration: 0.6 });
        openDetail(hub, true);
      });
      listPanel.appendChild(item);
    });

    const filtered = dayFilter === 'all'
      ? PLACES
      : PLACES.filter(p => p.day === Number(dayFilter));

    let lastDay = null;
    const bounds = HUBS.filter(h => h.inDefaultBounds).map(h => [h.lat, h.lng]);

    filtered.forEach(place => {
      bounds.push([place.lat, place.lng]);

      if (place.day !== lastDay) {
        const titleEl = document.createElement('div');
        titleEl.className = 'day-section-title';
        titleEl.innerHTML = `<span class="dot" style="background:${DAY_COLORS[place.day]}"></span>${DAY_NAMES[place.day]}`;
        listPanel.appendChild(titleEl);
        lastDay = place.day;
      }

      const icon = L.divIcon({
        className: '',
        html: `<div class="custom-marker" style="background:${DAY_COLORS[place.day]}">${place.step}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      const marker = L.marker([place.lat, place.lng], { icon }).addTo(markersLayer);
      marker.bindTooltip(place.shortName, {
        permanent: true,
        direction: 'right',
        offset: [13, 0],
        className: 'place-label-tooltip'
      });

      marker.on('click', () => openDetail(place, false));

      const item = document.createElement('div');
      item.className = 'place-item';
      item.innerHTML = `
        <div class="step-badge" style="background:${DAY_COLORS[place.day]}">${place.step}</div>
        <div class="place-info">
          <div class="place-time">${place.time}</div>
          <div class="place-title">${place.title}</div>
          <div class="place-cat">${place.category}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      `;
      item.addEventListener('click', () => {
        closeDrawer();
        map.flyTo([place.lat, place.lng], 16, { duration: 0.6 });
        openDetail(place, false);
      });
      listPanel.appendChild(item);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [45, 45] });
    }
    setTimeout(() => map.invalidateSize(), 150);
  }

  const drawerOverlay = document.getElementById('drawerOverlay');
  document.getElementById('openListBtn').addEventListener('click', () => {
    drawerOverlay.classList.add('open');
  });
  function closeDrawer() {
    drawerOverlay.classList.remove('open');
  }
  document.getElementById('closeListBtn').addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', (e) => {
    if (e.target === drawerOverlay) closeDrawer();
  });

  const overlay = document.getElementById('detailOverlay');
  const closeBtn = document.getElementById('closeDetail');

  function openDetail(item, isHub) {
    const badge = document.getElementById('detailDayBadge');
    if (isHub) {
      badge.textContent = `${item.icon} Repère fixe`;
      badge.style.background = '#1E293B';
      document.getElementById('detailMeta').textContent = item.category;
    } else {
      badge.textContent = `Jour ${item.day} • Étape ${item.step}`;
      badge.style.background = DAY_COLORS[item.day];
      document.getElementById('detailMeta').textContent = `${item.time} — ${item.category}`;
    }

    document.getElementById('detailTitle').textContent = item.title;
    document.getElementById('detailDesc').textContent = item.desc;
    document.getElementById('detailTip').innerHTML = `<span class="detail-box-label">💡 Bon plan</span>${item.tip}`;
    document.getElementById('detailTransit').innerHTML = `<span class="detail-box-label">🧣 S'y rendre au chaud</span>${item.transit}`;
    document.getElementById('detailGmaps').href = item.gmaps;

    overlay.classList.add('open');
  }

  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDay = btn.dataset.day;
      render(currentDay);
    });
  });

  const gpsBtn = document.getElementById('gpsBtn');
  let watchId = null;
  let userMarker = null;
  let userCircle = null;

  gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert("La géolocalisation n'est pas supportée par votre navigateur.");
      return;
    }

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      gpsBtn.classList.remove('tracking');
      if (userMarker) map.removeLayer(userMarker);
      if (userCircle) map.removeLayer(userCircle);
      userMarker = null;
      userCircle = null;
      return;
    }

    gpsBtn.classList.add('tracking');
    let firstFix = true;

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const latlng = [latitude, longitude];

        if (!userMarker) {
          const gpsIcon = L.divIcon({
            className: '',
            html: '<div class="gps-dot"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });
          userMarker = L.marker(latlng, { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          userCircle = L.circle(latlng, {
            radius: accuracy,
            color: '#2563EB',
            fillColor: '#2563EB',
            fillOpacity: 0.12,
            weight: 1
          }).addTo(map);
        } else {
          userMarker.setLatLng(latlng);
          userCircle.setLatLng(latlng).setRadius(accuracy);
        }

        if (firstFix) {
          map.flyTo(latlng, 16);
          firstFix = false;
        }
      },
      (err) => {
        alert("Impossible d'accéder à votre position GPS. Vérifiez les autorisations de Safari/Chrome.");
        gpsBtn.classList.remove('tracking');
        watchId = null;
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  });

  renderHubs();
  render('all');
</script>
